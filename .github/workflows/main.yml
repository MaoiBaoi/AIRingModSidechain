name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Ergebnis anzeigen
        run: Get-ChildItem -Recurse build/RingModSidechain_artefacts/Release/VST3 | Select-Object FullName

      - name: VST3 als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RingModSidechain-VST3-Windows
          path: build/RingModSidechain_artefacts/Release/VST3
          if-no-files-found: error
